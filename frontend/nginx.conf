server {
    listen 80;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_connect_timeout 3s;
    }
}